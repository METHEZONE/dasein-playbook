[project]
name = "dasein-one"
version = "0.1.0"
description = "RLHF for one person: a personal reward model + MCP server"
requires-python = ">=3.10"
dependencies = ["scikit-learn", "mcp<2"]
[project.scripts]
dasein = "dasein.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["dasein"]
[tool.hatch.build.targets.wheel.force-include]
"data/ai_generic.jsonl" = "dasein/ai_generic.jsonl"
